[package]
name = "fulcr"
version = "0.1.0"
edition = "2021"
description = "A developer registry that protects developer environments with metadata-first OCI materialization."

[dependencies]
anyhow = "1.0"
axum = "0.7"
cargo-lock = "10.1"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.0"
futures-util = "0.3.32"
hex = "0.4"
ignore = "0.4"
object = "0.36"
oci-spec = "0.9.0"
pem = "3.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.20"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.13"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
tokio = { version = "1.40", features = ["fs", "macros", "net", "process", "rt-multi-thread"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
x509-parser = "0.16"
zstd = "0.13"
