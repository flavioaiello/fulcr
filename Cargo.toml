[package]
name = "fulcr"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A developer registry that protects developer environments with metadata-first OCI materialization."

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
cargo-lock = "11.1"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.0"
futures-util = "0.3.32"
hex = "0.4"
ignore = "0.4"
object = "0.39"
oci-spec = "0.10"
pem = "3.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
roxmltree = "0.21"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.13"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
toml = "1.1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
x509-parser = "0.18"
zstd = "0.13"
